name: 🧑‍💻 Start of Dev Day (SOD)
description: Daily dev planning — environment, repos, priorities, and goals
title: "SOD: YYYY-MM-DD"
labels: ["daily", "development", "planning"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🧰 Environment & Setup
        Quick snapshot of your current dev context before coding.

  - type: input
    id: start_time
    attributes:
      label: 🕘 Start Time
      description: When are you starting your shift?
      placeholder: e.g., 09:15

  - type: input
    id: working_dir
    attributes:
      label: 📁 Active Working Directory / Repo
      description: Which project or repo are you focused on?
      placeholder: e.g., djmcodechain/portfolio or djmOS/core

  - type: input
    id: branch
    attributes:
      label: 🌿 Active Branch
      description: Which branch are you starting work on?
      placeholder: e.g., feature/auth-refactor

  - type: textarea
    id: build_state
    attributes:
      label: 🧠 Current Build Context
      description: What’s the state of your project as of now?
      placeholder: e.g., Migrations applied; pending API tests; frontend build stable.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 🎯 Top Priorities for Today
        Identify your 2–4 key dev goals or tickets to tackle.

  - type: textarea
    id: top_priorities
    attributes:
      label: Top Priorities
      description: Keep it focused and achievable — what’s getting built or fixed today?
      placeholder: |
        | # | Task | Expected Outcome |
        |---|------|------------------|
        | 1 |      |                  |
        | 2 |      |                  |
        | 3 |      |                  |
        | 4 |      |                  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 🔗 Related Issues / PRs

  - type: textarea
    id: related_issues
    attributes:
      label: Related Issues / PRs
      description: Reference related issues, PRs, or discussions for cross-linking.
      placeholder: "#123, #456"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 🧩 Dependencies or Blockers
        Note anything that could block progress — waiting on reviews, API changes, etc.

  - type: textarea
    id: blockers
    attributes:
      label: Dependencies / Blockers
      placeholder: e.g., Waiting on backend endpoint merge; npm package version mismatch.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 📅 Planned Work Blocks
        Plan your dev sprints or deep work sessions for the day.

  - type: textarea
    id: work_blocks
    attributes:
      label: Planned Work Blocks
      description: Timebox your coding sessions to stay on track.
      placeholder: |
        | Time | Focus | Notes |
        |------|--------|-------|
        | 10:00–11:30 | Backend migrations | |
        | 12:00–14:00 | Frontend integration | |
        | 15:00–17:00 | Code review + refactor | |
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## ⚙️ Dev Notes / Intentions
        Jot down environment setup notes, code quality goals, or build intentions.

  - type: textarea
    id: general_notes
    attributes:
      label: Dev Notes
      description: Reminders, build commands, or habits to keep in mind.
      placeholder: e.g., Keep commits atomic. Run migrations before push. Use `make dev-all`.
    validations:
      required: false
